{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - Gestion des Marchés Publics{% endblock %}

{% block content %}
<div class="row">
    <div class="col-6">
 <h1 style="font-size: 20px; align-items: center; color:gray;">Détails du document N°{{document.nom}}</h1>
    </div>
    <div class="col-6">
        
     <div class="btn-toolbar mb-2 mb-md-0" style="float: right;">
        <a href="{% url 'document_list' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Retour à la liste
        </a>
    </div>
    </div>
</div>
   
<div class="row">
<div class="col-6">
    <div class="Form-group" style="margin-top: 15px;"> 
        <label class="labell" >Nom </label>
        <input class="inp" type="text" disabled="true" value="{{document.nom}}">

    </div>
    <div class="Form-group" style="margin-top: 15px;"> 
        <label class="labell" >Type</label>
        <input class="inp" type="text" disabled="true" value="{{document.type}}">

    </div>
    <div class="Form-group" style="margin-top: 15px;"> 
        <label class="labell" >Date de telechargemnet</label>
        <input class="inp" type="date" disabled="true" value='{{document.date_doc|date:"Y-m-d"}}'>

    </div>
    
    <div class="Form-group" style="margin-top: 15px;"> 
        <label class="labell" >Telecharger par </label>
        <input class="inp" type="text" disabled="true" value="{{document.uploaded_by}}">

    </div>
    
     
    <div class="Form-group" style="margin-top: 15px;"> 
        <label class="labell" >Marche   </label>
        <input class="inp" type="text" disabled="true" value='{{document.marche}}'>

    </div>

  
    
    
    
    

    <div class="form-group" style="margin-top: 15px;">
        <label class="labell">Fichier</label><br>
        <a href="{{ document.fichier.url }}" target="_blank" class="btn btn-outline-primary">
            Télécharger le fichier
        </a>
    </div>




</div>   
     

</div>










{% endblock %}
